# Reference bindings for cec.toml. pépé installs these in its playback script
# only with -controls=hdmi-cec; do not load this file in keyboard mode.
# The pepe script supplies the named help/selector actions.
# Defaults still handle arrows (seek); TV volume/power keys remain unmapped.
# Programme keys are ignored by default. With --script-opts=pepe-volume_keys=yes,
# pepe.lua caps volume-max at 100 and uses these repeatable bindings instead:
# F3 osd-msg-bar add volume 5
# F4 osd-msg-bar add volume -5
ENTER cycle pause
ESC quit
HOME quit
s cycle sub
w ignore
r script-binding pepe/toggle-help
TAB script-binding pepe/subtitles
F3 ignore
F4 ignore
F5 set pause no
F6 set pause yes
F7 cycle pause
F8 quit
F9 seek -10
F10 seek 10
F11 add chapter -1
F12 add chapter 1
