# Pair with cec.toml; load using mpv --input-conf=/path/to/mpv-cec.conf.
# Defaults still handle arrows (seek); no changes to volume or TV power.
ENTER cycle pause
ESC quit
HOME quit
F1 cycle sub
F2 ignore
F3 ignore
F5 set pause no
F6 set pause yes
F7 cycle pause
F8 quit
F9 seek -10
F10 seek 10
F11 add chapter -1
F12 add chapter 1
