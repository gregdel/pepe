polochon_url: https://polochon.example
polochon_token: replace-me
mpv_path: mpv
fullscreen: false
player_fullscreen: true
# Use hdmi-cec for remote colour hints and session-local mpv remote bindings.
controls: keyboard
# Independent of controls; false also hides automatic playback guidance.
help_bar: true
# pepe shares the pause panel across desktop/appliance; native opts out.
mpv_osd: pepe
# Keep resume positions and watched marks in $XDG_STATE_HOME/pepe/progress.json.
# Written once after playback or a few seconds after marking; false keeps them in memory.
save_progress: true
mpv_managed_launcher: false
mpv_startup_timeout: 3s
mpv_stop_timeout: 2s
# Empty disables the web remote. ":8081" enables unauthenticated LAN access.
web_ui_addr: ""
