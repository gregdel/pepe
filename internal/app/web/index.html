<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pépé remote</title>
  <link rel="stylesheet" href="/remote.css">
  <script src="/remote.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="brand">pépé remote</p>
      <h1 id="now-playing">Nothing playing</h1>
      <p id="status" role="status">Connecting…</p>
      <p id="feedback" role="alert"></p>
    </header>
    <section class="playback" aria-labelledby="playback-heading">
      <h2 id="playback-heading">Playback</h2>
      <div class="playback-bar" role="group" aria-label="Playback controls">
        <button data-command="seek-back" aria-label="Seek back 10 seconds" title="Seek back 10 seconds" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M8 3 4 7l4 4M4 7h9a8 8 0 0 1 0 16" transform="translate(0 -1)"/>
            <text x="11" y="17">10</text>
          </svg>
        </button>
        <button class="playback-toggle" data-command="pause" aria-label="Pause or resume" title="Pause or resume" disabled>
          <svg viewBox="0 0 32 24" aria-hidden="true" focusable="false">
            <path class="solid" d="m3 5 10 7-10 7zM20 5h3v14h-3zM26 5h3v14h-3z"/>
          </svg>
        </button>
        <button data-command="seek-forward" aria-label="Seek forward 10 seconds" title="Seek forward 10 seconds" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m16 3 4 4-4 4m4-4h-9a8 8 0 0 0 0 16" transform="translate(0 -1)"/>
            <text x="13" y="17">10</text>
          </svg>
        </button>
        <button class="playback-stop" data-command="stop" aria-label="Stop playback" title="Stop playback" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect class="solid" x="5" y="5" width="14" height="14" rx="2"/>
          </svg>
        </button>
      </div>
    </section>
    <section aria-labelledby="navigation-heading">
      <h2 id="navigation-heading">Navigation</h2>
      <div class="dpad">
        <button class="up" data-action="up" aria-label="Up">↑</button>
        <button class="left" data-action="left" aria-label="Left">←</button>
        <button class="ok" data-action="ok">OK</button>
        <button class="right" data-action="right" aria-label="Right">→</button>
        <button class="down" data-action="down" aria-label="Down">↓</button>
      </div>
      <div class="buttons">
        <button data-action="back">Back</button>
        <button data-action="home">Home</button>
        <button data-action="section">Movies / Shows</button>
        <button data-action="subtitles">Subtitles</button>
      </div>
    </section>
    <section aria-labelledby="url-heading">
      <h2 id="url-heading">Play a URL</h2>
      <form id="url-form">
        <input id="url" aria-label="Video URL" name="url" type="url" inputmode="url" placeholder="https://…" required maxlength="8192" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button type="submit">Play URL</button>
      </form>
    </section>
  </main>
</body>
</html>
